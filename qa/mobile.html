<!doctype html><html lang="ru"><meta charset="utf-8"><title>РЕЙС 400 — проверка мобильного экрана</title><style>body{background:#ccd5e0;font:16px system-ui;margin:12px;display:flex;gap:20px;align-items:start}iframe{width:390px;height:844px;border:0;box-shadow:0 8px 30px #3344}body:has(#small:checked) iframe{width:320px;height:740px}label{display:block;margin:15px 0}</style><aside><h1>Мобильная проверка</h1><label><input id="small" type="checkbox">320 × 740</label><p>Обычный размер: 390 × 844</p><p id="requests">Запросы…</p></aside><iframe title="Игра на телефоне" src="/"></iframe></html>
