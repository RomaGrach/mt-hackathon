services:
  game:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      HR_API_KEY: ${HR_API_KEY:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - game-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  game-data:
