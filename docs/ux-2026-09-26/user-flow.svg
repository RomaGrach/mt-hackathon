<text x="66" y="557" fill="#617d66" font-size="12" letter-spacing="1">ДЕЛА ПОЛУЧИЛИ ИСХОД</text><text x="66" y="587" fill="#304c36" font-size="20" font-weight="600">Итог рейса → профиль → следующая практика</text><text x="66" y="614" fill="#617d66" font-size="13">Причины, критерии и история · XP отдельно · рейтинг добровольно</text>
<path d="M130 420v98" fill="none" stroke="#8b7b9b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="44" y="692" fill="#756b7c" font-size="13">Возврат не обнуляет мир. Скрытые дела не входят в счётчик. Запрос коллеге ещё не означает выполненную помощь.</text>
